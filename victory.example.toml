# Copy to `victory.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VICTORY_CONFIG selects a different config file (the file, not its folder;
# a leading ~ is your home folder).
# Relative paths here are relative to this file; a leading ~ is your home folder.
# An empty variable counts as unset.
# The paths below are Windows examples; on Linux or macOS change them to paths
# on that machine (a D:\ path there is refused, not read as relative).

[paths]
# Your own dump of Grand Theft Auto VI.     env: VICTORY_GAME_DIR
# It is only read: it must not be inside cache_dir, and neither cache_dir nor
# data_dir may be inside it.
game_dir = 'D:\victory-data\game'

# Derived data. Default: %LOCALAPPDATA%\victory\cache, or without LOCALAPPDATA
# (Linux) $XDG_CACHE_HOME/victory, else ~/.cache/victory.   env: VICTORY_CACHE_DIR
# cache_dir = 'D:\victory-data\cache'

# What titles save (persistent local storage), kept apart from the cache:
# it must not be inside cache_dir, which may be deleted at any time.
# Default: %LOCALAPPDATA%\victory\data, or without LOCALAPPDATA (Linux)
# $XDG_DATA_HOME/victory, else ~/.local/share/victory.   env: VICTORY_DATA_DIR
# data_dir = 'D:\victory-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VICTORY_TEST_TITLES (separated by ';' on Windows, ':' elsewhere)
test_titles = []
