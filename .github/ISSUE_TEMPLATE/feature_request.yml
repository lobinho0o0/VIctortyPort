name: Feature request
description: A function that VIctory does not have.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read the status table in the README first. Work that it lists under "Needs" is known and does not need a request.

  - type: textarea
    id: request
    attributes:
      label: Request
      description: What VIctory must do, and which hardware or users it helps.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: How it can be done, if you know. Give links to sources and their licences.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I searched the issues and the README, and found no request for this.
          required: true
